[package]
name = "ubuprobe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ubuntu DEP-8 package test definition inspector"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
